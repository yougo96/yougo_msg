<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:">
  <title>HP Message</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <aside id="sidebar">
    <nav id="accounts" aria-label="Messageries"></nav>
    <div id="tools">
      <button id="dnd" class="tool" aria-pressed="false" aria-label="Ne pas déranger">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z M10 21a2 2 0 0 0 4 0" />
          <line class="slash" x1="4" y1="3" x2="20" y2="21" />
        </svg>
      </button>
      <button id="menu" class="tool" aria-label="Menu" title="Ajouter une messagerie, réglages, diagnostic, quitter">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="5" cy="12" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="19" cy="12" r="1.6" />
        </svg>
      </button>
    </div>
  </aside>
  <!-- Visible seulement quand aucune messagerie n'est affichée à droite (aucun compte, page en erreur). -->
  <main id="stage">
    <section id="panel" hidden>
      <h1 id="panel-title"></h1>
      <p id="panel-text"></p>
      <button id="panel-action" hidden></button>
    </section>
  </main>
  <script src="badge-art.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
